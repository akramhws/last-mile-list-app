name: ${APP_NAME}
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "16.0"
settings:
  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
  DEVELOPMENT_TEAM: ${TEAM_ID}
  MARKETING_VERSION: ${APP_VERSION}
  CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
  SWIFT_VERSION: "5.9"
  # يربط الأيقونة من كتالوج الأصول، ويولّد CFBundleIconName تلقائياً —
  # وغيابه كان يرفضه فحص Apple: "A value for 'CFBundleIconName' is missing".
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  ${APP_NAME}:
    type: application
    platform: iOS
    sources: Sources
    info:
      path: ${APP_NAME}/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        UILaunchScreen:
          UIColorName: ""
        # الأربعة كلها مطلوبة: Apple ترفض Portrait وحده لأجل تعدّد مهام iPad.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
